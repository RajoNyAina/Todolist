services:
  web_api:
    container_name: todolist_app
    build: .
    image: todolist-api:1.0.0
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres
    container_name: postgres_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "t0d0L!st_"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  postgres_data: